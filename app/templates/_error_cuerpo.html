<div class="tarjeta error-pagina"><div class="tarjeta-cuerpo">
  <div class="error-codigo">{{ codigo }}</div>
  <h1>{{ titulo }}</h1>
  <p class="suave">{{ mensaje }}</p>
  {% if current_user.is_authenticated and current_user.es_personal %}
  <a class="btn btn-primario" href="{{ url_for('turnos.lista') }}">Volver a la agenda</a>
  {% else %}
  <a class="btn btn-primario" href="{{ url_for('publico.inicio') }}">Volver al inicio</a>
  {% endif %}
</div></div>
