# Blueprint de Render
services:
  - type: web
    name: consultorio-setfe
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: consultorio-setfe-db
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: consultorio-setfe-db
    plan: free
    databaseName: consultorio
    user: consultorio
    ipAllowList: []  # Solo red interna
